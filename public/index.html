<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp — Innar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wa-page">
    <header class="wa-topbar">
      <div class="wa-brand">
        <span class="wa-brand-mark" aria-hidden="true">IN</span>
        <div class="wa-topbar-titles">
          <h1 class="wa-title">Innar WhatsApp</h1>
          <p class="wa-subtitle">Agenda · Recordatorios · Chat</p>
        </div>
      </div>
      <div id="waStatusPill" class="wa-status-pill">—</div>
      <button type="button" id="btnLogout" class="wa-btn-ghost">Salir</button>
    </header>

    <nav class="wa-tabs" role="tablist">
      <button type="button" class="wa-tab is-active" data-tab="eventos" role="tab" aria-selected="true">Agenda</button>
      <button type="button" class="wa-tab" data-tab="chats" role="tab" aria-selected="false">
        Chats <span id="waTabUnread" class="wa-tab-badge hidden">0</span>
      </button>
    </nav>

    <section id="panel-eventos" class="wa-panel" role="tabpanel">
      <div class="wa-calendar-bar">
        <label class="wa-doctor-pick">
          <span class="wa-doctor-pick-label">Calendario</span>
          <div class="wa-select-shell">
            <select id="waDoctorSelect" aria-label="Elegir doctora o calendario"></select>
          </div>
        </label>
        <label class="wa-cal-label">Fecha
          <input type="date" id="waCalDate" />
        </label>
        <button type="button" id="btnCalLoad" class="wa-btn-sec">Actualizar</button>
        <button type="button" id="btnCalSend" class="wa-btn-prim">Enviar todos</button>
        <button type="button" id="btnCalNew" class="wa-btn-sec">+ Nuevo evento</button>
        <span id="waCalResult" class="wa-cal-result"></span>
      </div>
      <div class="wa-ev-filters" role="toolbar" aria-label="Filtrar citas">
        <button type="button" class="wa-chip is-active" data-ev-filter="all">Todas <span id="evCountAll">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="pending">Pendientes <span id="evCountPending">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="sent">Enviados <span id="evCountSent">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="phone">Tel. pendiente <span id="evCountPhone">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="si">Confirmados <span id="evCountSi">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="no">Cancelados <span id="evCountNo">0</span></button>
        <button type="button" class="wa-chip" data-ev-filter="ask">Escríbenos <span id="evCountAsk">0</span></button>
      </div>
      <div class="wa-events-wrap">
        <div id="waEventsEmpty" class="wa-events-empty hidden">
          Cargando agenda del día…
        </div>
        <div id="waEventsTableWrap" class="wa-patients-grid"></div>
      </div>
    </section>

    <section id="panel-chats" class="wa-panel hidden" role="tabpanel">
      <div class="wa-layout">
        <aside class="wa-sidebar">
          <div class="wa-search-wrap">
            <input type="search" id="waSearchInput" class="wa-search" placeholder="Buscar paciente o teléfono…" />
            <div class="wa-chat-filters" role="toolbar" aria-label="Filtrar chats">
              <button type="button" class="wa-chat-filter is-active" data-chat-filter="todos">Todos</button>
              <button type="button" class="wa-chat-filter" data-chat-filter="noleidos">No leídos</button>
            </div>
          </div>
          <div id="waConvList" class="wa-conv-list"></div>
        </aside>
        <section class="wa-thread">
          <div id="waThreadEmpty" class="wa-thread-empty">
            <div class="wa-thread-empty-card">
              <p class="wa-thread-empty-title">Bandeja de mensajes</p>
              <p>Seleccione un chat o envíe un recordatorio desde la agenda.</p>
            </div>
          </div>
          <div id="waThreadActive" class="wa-thread-active hidden">
            <header class="wa-thread-head">
              <div class="wa-thread-avatar" id="waThreadAvatar">?</div>
              <div class="wa-thread-head-main">
                <div id="waThreadName" class="wa-thread-name">—</div>
                <div id="waThreadPhone" class="wa-thread-phone">—</div>
                <div id="waThreadRsvp" class="wa-thread-rsvp"></div>
              </div>
              <span id="waThreadWindow" class="wa-window-pill"></span>
              <button type="button" id="btnDeleteChat" class="wa-btn-danger">Eliminar</button>
            </header>
            <div id="waMessageList" class="wa-message-list"></div>
            <div id="waCitaBar" class="wa-cita-bar hidden"></div>
            <div id="waQuick" class="wa-quick hidden"></div>
            <p id="waComposerHint" class="wa-hint hidden"></p>
            <form id="waReplyForm" class="wa-composer">
              <textarea id="waReplyInput" rows="1" placeholder="Escribir mensaje…" maxlength="4000"></textarea>
              <button type="submit" id="waReplyBtn" class="wa-send-btn" aria-label="Enviar">Enviar</button>
            </form>
          </div>
        </section>
      </div>
    </section>
  </div>

  <div id="waModalBackdrop" class="wa-modal-backdrop hidden" aria-hidden="true">
    <div class="wa-modal" role="dialog" aria-labelledby="waModalTitle">
      <header class="wa-modal-head">
        <h2 id="waModalTitle">Nuevo evento</h2>
        <button type="button" id="btnModalClose" class="wa-modal-close" aria-label="Cerrar">×</button>
      </header>
      <form id="waNewEventForm" class="wa-modal-body">
        <label>Profesional / calendario
          <select id="neCalendar" required></select>
        </label>
        <label>Paciente
          <input type="text" id="nePaciente" required maxlength="120" placeholder="Nombre" />
        </label>
        <label>Teléfono
          <input type="tel" id="neTelefono" required maxlength="20" placeholder="3001234567" />
        </label>
        <div class="wa-modal-row">
          <label>Fecha
            <input type="date" id="neFecha" required />
          </label>
          <label>Hora
            <input type="time" id="neHora" required />
          </label>
          <label>Duración (min)
            <input type="number" id="neDuracion" min="15" max="480" value="45" />
          </label>
        </div>
        <label>Ubicación (opcional)
          <input type="text" id="neUbicacion" maxlength="200" />
        </label>
        <label class="wa-check">
          <input type="checkbox" id="neSendWa" />
          Enviar recordatorio WhatsApp al crear
        </label>
        <div class="wa-modal-actions">
          <button type="button" id="btnModalCancel" class="wa-btn-sec">Cancelar</button>
          <button type="submit" class="wa-btn-prim">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="waPhoneModalBackdrop" class="wa-modal-backdrop hidden" aria-hidden="true">
    <div class="wa-modal" role="dialog" aria-labelledby="waPhoneModalTitle">
      <header class="wa-modal-head">
        <h2 id="waPhoneModalTitle">Editar teléfono</h2>
        <button type="button" id="btnPhoneModalClose" class="wa-modal-close" aria-label="Cerrar">×</button>
      </header>
      <form id="waPhoneEditForm" class="wa-modal-body">
        <p id="waPhoneEditPatient" class="wa-phone-edit-patient"></p>
        <label>Teléfono
          <input type="tel" id="peTelefono" required maxlength="20" placeholder="3001234567" inputmode="numeric" />
        </label>
        <p id="waPhoneEditHint" class="wa-phone-edit-hint">Use 10 dígitos (celular) o con 57.</p>
        <div class="wa-modal-actions">
          <button type="button" id="btnPhoneModalCancel" class="wa-btn-sec">Cancelar</button>
          <button type="submit" class="wa-btn-prim">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales/es.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/relativeTime.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
